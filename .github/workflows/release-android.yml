name: Release Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew

      - name: Inject google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > apps/android/app/google-services.json

      # Generate debug keystore (runners don't have it pre-created)
      - name: Generate debug keystore & create keystore.properties
        run: |
          mkdir -p /root/.android
          keytool -genkeypair -v \
            -keystore /root/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt
          cat > apps/android/keystore.properties <<EOF
          storeFile=/root/.android/debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Build release APK
        working-directory: apps/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk sleek-${{ steps.version.outputs.VERSION }}.apk
          cp apps/android/app/build/outputs/apk/release/app-release.apk sleek.apk

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          gh release delete "${VERSION}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${VERSION}" \
            "sleek-${VERSION}.apk" \
            "sleek.apk" \
            --title "SLEEK ${VERSION}" \
            --notes "Download sleek-${VERSION}.apk and install on Android 8.0+"
