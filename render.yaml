services:
  # ── Backend ──────────────────────────────────────────────────────────────
  - type: web
    name: sleek-server
    env: node
    region: oregon
    plan: free
    rootDir: apps/server
    buildCommand: npm install -g pnpm && pnpm install && pnpm db:generate && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  # ── Frontend ──────────────────────────────────────────────────────────────
  - type: web
    name: sleek-web
    env: static
    region: oregon
    plan: free
    rootDir: apps/web
    buildCommand: npm install -g pnpm && pnpm install && pnpm build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
