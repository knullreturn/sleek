workflows:
  android-release:
    name: SLEEK Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2  # Fastest available — 2-3x faster than Linux

    environment:
      vars:
        # Set these in Codemagic → Environment variables (mark as secret):
        # CM_KEYSTORE_BASE64   — base64 of your .keystore file
        # CM_KEYSTORE_PASSWORD — keystore password
        # CM_KEY_ALIAS         — key alias
        # CM_KEY_PASSWORD      — key password
        # GITHUB_TOKEN         — GitHub personal access token (for release upload)
        PACKAGE_NAME: "com.sleek.app"
      java: 17

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Set Android SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > apps/android/local.properties

      - name: Inject keystore
        script: |
          echo "$CM_KEYSTORE_BASE64" | base64 --decode > apps/android/sleek-release.keystore
          cat > apps/android/keystore.properties <<EOF
          storeFile=$(pwd)/apps/android/sleek-release.keystore
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

      - name: Inject google-services.json
        script: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/android/app/google-services.json

      - name: Make gradlew executable
        script: chmod +x apps/android/gradlew

      - name: Build release APK
        script: |
          cd apps/android
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.configureondemand=true

    artifacts:
      - apps/android/app/build/outputs/apk/release/app-release.apk

    publishing:
      github_releases:
        prerelease: false
        artifact_patterns:
          - app-release.apk
      email:
        recipients:
          - navaeneethredy6666@gmail.com
        notify:
          success: true
          failure: true
