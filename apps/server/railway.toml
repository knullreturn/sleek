[build]
builder = "nixpacks"
buildCommand = "npm install -g pnpm@9 && cd ../.. && pnpm install --no-frozen-lockfile && cd apps/server && npx prisma generate && npx tsc"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 10
