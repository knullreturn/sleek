# Gradle JVM — increased from 2g to 3g for KSP + Hilt + Compose
# MaxMetaspace increased from 512m to 1g (Compose compiler alone needs ~400m)
org.gradle.jvmargs=-Xmx3g -Xms512m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin compile daemon — runs in a SEPARATE process from Gradle.
# Without this it gets a tiny default heap and crashes (error code 0).
# -XX:-UseParallelGC: recommended by Kotlin daemon error message to avoid GC auto-selection crash.
kotlin.daemon.jvm.options=-Xmx2g -Xms256m -XX:MaxMetaspaceSize=512m -XX:-UseParallelGC

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Incremental compilation — speeds up rebuilds significantly
kotlin.incremental=true
# Incremental annotation processing (KSP/Hilt)
kapt.incremental.apt=true
# Use precise incremental compilation for Compose
kotlin.incremental.useClasspathSnapshot=true
