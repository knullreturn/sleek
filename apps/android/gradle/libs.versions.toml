[versions]
agp                     = "8.7.3"
kotlin                  = "2.0.21"
ksp                     = "2.0.21-1.0.28"
composeBom              = "2024.12.01"
coreKtx                 = "1.15.0"
activityCompose         = "1.9.3"
lifecycle               = "2.8.7"
navigation              = "2.8.5"
hilt                    = "2.51.1"
hiltNavigationCompose   = "1.2.0"
retrofit                = "2.9.0"
okhttp                  = "4.12.0"
room                    = "2.6.1"
datastore               = "1.1.1"
coil                    = "2.7.0"
socketIo                = "2.1.0"
coroutines              = "1.9.0"
gson                    = "2.10.1"
splashscreen            = "1.0.1"
credentials             = "1.3.0"
googleId                = "1.1.1"
firebaseBom             = "33.7.0"
googleServices          = "4.4.2"
profileinstaller        = "1.4.1"

[libraries]
# Core
androidx-core-ktx                       = { group = "androidx.core",              name = "core-ktx",                      version.ref = "coreKtx" }
androidx-activity-compose               = { group = "androidx.activity",           name = "activity-compose",               version.ref = "activityCompose" }
androidx-splashscreen                   = { group = "androidx.core",              name = "core-splashscreen",              version.ref = "splashscreen" }

# Compose BOM
androidx-compose-bom                    = { group = "androidx.compose",            name = "compose-bom",                   version.ref = "composeBom" }
androidx-compose-ui                     = { group = "androidx.compose.ui",         name = "ui" }
androidx-compose-ui-graphics            = { group = "androidx.compose.ui",         name = "ui-graphics" }
androidx-compose-ui-tooling             = { group = "androidx.compose.ui",         name = "ui-tooling" }
androidx-compose-ui-tooling-preview     = { group = "androidx.compose.ui",         name = "ui-tooling-preview" }
androidx-compose-material3              = { group = "androidx.compose.material3",  name = "material3" }
androidx-compose-material-icons         = { group = "androidx.compose.material",   name = "material-icons-extended" }
androidx-compose-animation              = { group = "androidx.compose.animation",  name = "animation" }
androidx-compose-foundation             = { group = "androidx.compose.foundation", name = "foundation" }

# Lifecycle
androidx-lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-compose",   version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx          = { group = "androidx.lifecycle",          name = "lifecycle-runtime-ktx",         version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose      = { group = "androidx.lifecycle",          name = "lifecycle-runtime-compose",     version.ref = "lifecycle" }

# Navigation
androidx-navigation-compose             = { group = "androidx.navigation",         name = "navigation-compose",            version.ref = "navigation" }

# Hilt
hilt-android                            = { group = "com.google.dagger",           name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler                           = { group = "com.google.dagger",           name = "hilt-android-compiler",         version.ref = "hilt" }
hilt-navigation-compose                 = { group = "androidx.hilt",              name = "hilt-navigation-compose",       version.ref = "hiltNavigationCompose" }

# Network
retrofit                                = { group = "com.squareup.retrofit2",      name = "retrofit",                      version.ref = "retrofit" }
retrofit-gson                           = { group = "com.squareup.retrofit2",      name = "converter-gson",                version.ref = "retrofit" }
okhttp                                  = { group = "com.squareup.okhttp3",        name = "okhttp",                        version.ref = "okhttp" }
okhttp-logging                          = { group = "com.squareup.okhttp3",        name = "logging-interceptor",           version.ref = "okhttp" }
gson                                    = { group = "com.google.code.gson",        name = "gson",                          version.ref = "gson" }
socket-io                               = { group = "io.socket",                   name = "socket.io-client",              version.ref = "socketIo" }

# Room
room-runtime                            = { group = "androidx.room",               name = "room-runtime",                  version.ref = "room" }
room-compiler                           = { group = "androidx.room",               name = "room-compiler",                 version.ref = "room" }
room-ktx                                = { group = "androidx.room",               name = "room-ktx",                      version.ref = "room" }

# DataStore
datastore-preferences                   = { group = "androidx.datastore",          name = "datastore-preferences",         version.ref = "datastore" }

# Coil
coil-compose                            = { group = "io.coil-kt",                  name = "coil-compose",                  version.ref = "coil" }

# Coroutines
coroutines-android                      = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",    version.ref = "coroutines" }

# Google Sign-In via Credential Manager
credentials                             = { group = "androidx.credentials",         name = "credentials",                   version.ref = "credentials" }
credentials-play                        = { group = "androidx.credentials",         name = "credentials-play-services-auth", version.ref = "credentials" }
google-id                               = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }

# Firebase
firebase-bom                            = { group = "com.google.firebase", name = "firebase-bom",      version.ref = "firebaseBom" }
firebase-messaging                      = { group = "com.google.firebase", name = "firebase-messaging-ktx" }

# Baseline Profiles
androidx-profileinstaller               = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }

[plugins]
android-application     = { id = "com.android.application",            version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                     = { id = "com.google.devtools.ksp",            version.ref = "ksp" }
hilt                    = { id = "com.google.dagger.hilt.android",     version.ref = "hilt" }
google-services         = { id = "com.google.gms.google-services",     version.ref = "googleServices" }
